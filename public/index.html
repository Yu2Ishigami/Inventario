<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventario · Mi Tienda</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">📦</span>
      <div>
        <h1>Inventario</h1>
        <p>Mi Tienda</p>
      </div>
    </div>
    <button id="btn-new" class="btn btn-primary">+ Nuevo producto</button>
  </header>

  <main class="container">
    <section id="stats" class="stats"></section>

    <section class="card">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Buscar por nombre, SKU o categoría…" />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Categoría</th>
              <th class="num">Precio</th>
              <th class="center">Stock</th>
              <th class="right">Acciones</th>
            </tr>
          </thead>
          <tbody id="products-body"></tbody>
        </table>
        <p id="empty" class="empty" hidden>No hay productos para mostrar.</p>
      </div>
    </section>
  </main>

  <dialog id="dialog">
    <form id="product-form" method="dialog">
      <h2 id="dialog-title">Nuevo producto</h2>
      <input type="hidden" name="id" />

      <label>Nombre
        <input name="name" required />
      </label>
      <div class="row">
        <label>SKU
          <input name="sku" required />
        </label>
        <label>Categoría
          <input name="category" placeholder="General" />
        </label>
      </div>
      <div class="row">
        <label>Precio
          <input name="price" type="number" step="0.01" min="0" required />
        </label>
        <label>Stock
          <input name="stock" type="number" min="0" step="1" value="0" required />
        </label>
        <label>Mínimo
          <input name="min_stock" type="number" min="0" step="1" value="5" required />
        </label>
      </div>

      <p id="form-error" class="form-error" hidden></p>

      <div class="actions">
        <button type="button" id="btn-cancel" class="btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
