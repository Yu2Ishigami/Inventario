<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inventario · Mi Tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Aplica el tema guardado antes de pintar (evita parpadeo)
    try {
      const t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (_) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 7.5L12 12.5l8.7-5M12 22V12.5"/></svg>
        </span>
        <div>
          <h1>Inventario</h1>
          <p>Mi Tienda</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="btn-theme" class="icon-btn" title="Cambiar tema" aria-label="Cambiar tema">
          <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button id="btn-new" class="btn btn-primary">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Nuevo producto
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <section id="stats" class="stats"></section>

    <section class="card">
      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search" type="search" placeholder="Buscar por nombre, SKU o categoría…" />
        </div>
        <div class="chips" id="filters">
          <button class="chip active" data-filter="all">Todos</button>
          <button class="chip" data-filter="low">Stock bajo</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Categoría</th>
              <th class="num">Precio</th>
              <th class="center">Stock</th>
              <th class="right">Acciones</th>
            </tr>
          </thead>
          <tbody id="products-body"></tbody>
        </table>
        <div id="empty" class="empty" hidden>
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3.3 7.5L12 12.5l8.7-5M12 22V12.5"/></svg>
          <p>No hay productos para mostrar</p>
          <small>Prueba otra búsqueda o agrega uno nuevo.</small>
        </div>
      </div>
      <div class="card-footer" id="count"></div>
    </section>
  </main>

  <dialog id="dialog">
    <form id="product-form" method="dialog">
      <h2 id="dialog-title">Nuevo producto</h2>
      <input type="hidden" name="id" />

      <label>Nombre
        <input name="name" required placeholder="Ej. Arroz Costeño 1kg" />
      </label>
      <div class="row">
        <label>SKU
          <input name="sku" required placeholder="ARR-001" />
        </label>
        <label>Categoría
          <input name="category" placeholder="General" />
        </label>
      </div>
      <div class="row">
        <label>Precio (S/)
          <input name="price" type="number" step="0.01" min="0" required />
        </label>
        <label>Stock
          <input name="stock" type="number" min="0" step="1" value="0" required />
        </label>
        <label>Mínimo
          <input name="min_stock" type="number" min="0" step="1" value="5" required />
        </label>
      </div>

      <p id="form-error" class="form-error" hidden></p>

      <div class="actions">
        <button type="button" id="btn-cancel" class="btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
